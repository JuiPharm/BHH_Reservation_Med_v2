name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure public Apps Script endpoint
        env:
          APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycbwv-KXqQPyqa1VaLZuss54tSkbsGm4xCJkhMYsANFs9OM79CAh70uACJRrVKM9v0lhT/exec
        run: node scripts/configure-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/
      - id: deployment
        uses: actions/deploy-pages@v4
